# Builds a release from a pushed tag v<version>, so every published exe can be traced to its commit:
# GitHub signs a build provenance attestation for it (check with
# `gh attestation verify physmouse-v<version>-installer.exe -R lieberlenny/physmouse`),
# and the release notes carry its SHA-256. Action versions are pinned by commit.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        shell: cmd
        run: build.cmd

      - name: Check the version and prepare the release
        id: prep
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $built = (Get-Item bin\physmouse.exe).VersionInfo.FileVersion
          if ($built -ne "$version.0") { throw "Tag $version doesn't match AssemblyFileVersion $built in src/Program.cs" }
          $asset = "physmouse-v$version-installer.exe"
          Copy-Item bin\physmouse.exe $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash

          # notes: this version's section of CHANGELOG.md, then the hash and how to verify the build
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -match "^## $([regex]::Escape($version))( |$)" } | Select-Object -First 1))
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $body = $lines[($start + 1)..($lines.Count - 1)]
          $end = [array]::IndexOf($body, ($body | Where-Object { $_ -match '^## ' } | Select-Object -First 1))
          if ($end -ge 0) { $body = $body[0..($end - 1)] }
          $notes = (($body -join "`n").Trim()) + @"


          ---
          **SHA-256** of ``$asset``: ``$hash``

          This file was built from this tag by GitHub Actions. To check it, run:
          ``gh attestation verify $asset -R ${{ github.repository }}``

          The exe is unsigned, so Windows SmartScreen or antivirus software may warn about it.
          "@
          Set-Content notes.md $notes -Encoding utf8
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.prep.outputs.asset }}

      # The same attestation also goes on the release as a file, so it can be checked offline
      # (and OpenSSF Scorecard's Signed-Releases check finds it).
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $provenance = "${{ steps.prep.outputs.asset }}.intoto.jsonl"
          Copy-Item "${{ steps.attest.outputs.bundle-path }}" $provenance
          gh release create "${{ github.ref_name }}" "${{ steps.prep.outputs.asset }}" $provenance --title "Release ${{ github.ref_name }}" --notes-file notes.md --verify-tag
